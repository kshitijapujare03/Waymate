<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waymate - Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <div class="login-icon">✈</div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">Login to continue your journey with Waymate.</p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="Enter your email" class="input-field" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="Enter your password" class="input-field" required>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

        <a href="index.html" class="back-home">← Back to Home</a>

    </div>

</div>

<footer class="footer">
    <p>© 2026 Waymate. Your Smart Tourism Companion.</p>
</footer>
<script src="login.js"></script>
</body>
</html>
