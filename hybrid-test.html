
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMate - Hybrid Recommendation Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #243047;
            padding: 30px 15px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #173b67;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667085;
            margin-bottom: 25px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #173b67;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #24558c;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin: 20px 0;
            font-weight: bold;
        }

        .recommendations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px #00000012;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card-content {
            padding: 18px;
        }

        .card h2 {
            color: #173b67;
            margin-bottom: 8px;
        }

        .match {
            color: #16804a;
            font-size: 21px;
            font-weight: bold;
            margin: 12px 0;
        }

        .details {
            line-height: 1.8;
            font-size: 14px;
            white-space: pre-line;
        }

        .explanation {
            margin-top: 12px;
            color: #667085;
            font-size: 14px;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>WayMate</h1>
    <p class="subtitle">Hybrid Travel Recommendation System</p>

    <div class="form-box">

        <form id="preferenceForm">

            <div class="form-grid">

                <div>
                    <label>Starting City</label>
                    <input type="text" id="startingCity"
                           value="Mumbai" required>
                </div>

                <div>
                    <label>Number of Days</label>
                    <input type="number" id="travelDays"
                           value="3" min="1" required>
                </div>

                <div>
                    <label>Budget (₹)</label>
                    <input type="number" id="budget"
                           value="10000" min="1" required>
                </div>

                <div>
                    <label>Travel Type</label>
                    <select id="travelType">
                        <option value="Beach">Beach</option>
                        <option value="Nature">Nature</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Heritage">Heritage</option>
                        <option value="Hill Station">Hill Station</option>
                        <option value="Religious">Religious</option>
                        <option value="Any">Any</option>
                    </select>
                </div>

                <div>
                    <label>Number of Travellers</label>
                    <input type="number" id="travellers"
                           value="2" min="1" required>
                </div>

                <div>
                    <label>Travel Company</label>
                    <select id="travelCompany">
                        <option value="Friends">Friends</option>
                        <option value="Family">Family</option>
                        <option value="Solo">Solo</option>
                        <option value="Couple">Couple</option>
                    </select>
                </div>

                <div>
                    <label>Preferred Destination</label>
                    <select id="preferredDestination">
                        <option value="not decided">Not Decided</option>
                        <option value="Goa">Goa</option>
                        <option value="Kerala">Kerala</option>
                        <option value="Jaipur">Jaipur</option>
                        <option value="Manali">Manali</option>
                        <option value="Agra">Agra</option>
                    </select>
                </div>

                <div>
                    <label>Weather Preference</label>
                    <select id="weatherPreference">
                        <option value="any">Any</option>
                        <option value="Cool">Cool</option>
                        <option value="Warm">Warm</option>
                        <option value="Pleasant">Pleasant</option>
                    </select>
                </div>

            </div>

            <button type="submit" id="submitBtn">
                Get Recommendations
            </button>

        </form>

    </div>

    <p id="status"></p>

    <div class="recommendations" id="recommendations"></div>

</div>

<script>

const form = document.getElementById("preferenceForm");
const statusBox = document.getElementById("status");
const resultsBox = document.getElementById("recommendations");
const submitBtn = document.getElementById("submitBtn");


// FORMAT BUDGET
function formatBudget(min, max) {

    if (min == null || max == null ||
        min === "" || max === "") {
        return "Budget information unavailable";
    }

    return `₹${Number(min).toLocaleString("en-IN")} - ₹${Number(max).toLocaleString("en-IN")}`;
}


// FORMAT RATING
function formatRating(rating) {

    if (rating == null || rating === "" ||
        !Number.isFinite(Number(rating)) ||
        Number(rating) <= 0) {
        return "Not Rated";
    }

    return `${rating}/5`;
}


// FORMAT WEATHER
function formatWeather(weather) {

    if (weather == null || String(weather).trim() === "" ||
        String(weather).trim().toLowerCase() === "n/a") {
        return "Weather information unavailable";
    }

    return weather;
}


// FORM SUBMISSION
form.addEventListener("submit", async function(event) {

    event.preventDefault();

    resultsBox.innerHTML = "";
    statusBox.textContent = "Finding the best destinations...";
    submitBtn.disabled = true;

    const body = {
        startingCity: document.getElementById("startingCity").value,
        travelDays: Number(document.getElementById("travelDays").value),
        budget: Number(document.getElementById("budget").value),
        travelType: document.getElementById("travelType").value,
        travellers: Number(document.getElementById("travellers").value),
        travelCompany: document.getElementById("travelCompany").value,
        preferredDestination: document.getElementById("preferredDestination").value,
        weatherPreference: document.getElementById("weatherPreference").value
    };

    try {

        const response = await fetch(
            "http://127.0.0.1:5001/api/plan-trip",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || data.message || "API request failed");
        }

        const destinations = data.recommendations || [];

        if (destinations.length === 0) {
            statusBox.textContent = "No recommendations found.";
            return;
        }

        statusBox.textContent =
            data.message || "Recommendations generated successfully!";


        destinations.forEach(destination => {

            const card = document.createElement("div");
            card.className = "card";


            // DESTINATION IMAGE
            const imageUrl = destination.image || destination.image_url;

            if (imageUrl) {

                const image = document.createElement("img");

                image.src = imageUrl;
                image.alt = destination.name || "Destination";

                image.onerror = function() {
                    this.style.display = "none";
                };

                card.appendChild(image);
            }


            const content = document.createElement("div");
            content.className = "card-content";


            // DESTINATION NAME
            const name = document.createElement("h2");
            name.textContent = destination.name || "Destination";


            // LOCATION
            const location = document.createElement("p");
            location.textContent = destination.location || "Location unavailable";


            // MATCH PERCENTAGE
            const match = document.createElement("p");
            match.className = "match";

            const matchValue =
                destination.matchPercentage ??
                destination.match_percentage ?? 0;

            match.textContent = "Match: " + matchValue + "%";


            // DESTINATION DETAILS
            const details = document.createElement("div");
            details.className = "details";

            const budgetText = formatBudget(
                destination.budget_min,
                destination.budget_max
            );

            const ratingText = formatRating(destination.rating);

            const weatherText = formatWeather(destination.weather);

            const type =
                destination.type ||
                destination.destination_type ||
                "N/A";

            const days =
                destination.days ??
                destination.recommended_days ??
                "N/A";

            details.textContent =
                `Type: ${type}
Budget: ${budgetText}
Days: ${days}
Rating: ${ratingText}
Weather: ${weatherText}`;


            // EXPLANATION
            const explanation = document.createElement("p");
            explanation.className = "explanation";

            explanation.textContent =
                destination.matchExplanation ||
                destination.match_explanation ||
                "";


            content.append(name, location, match, details, explanation);
            card.appendChild(content);

            resultsBox.appendChild(card);

        });

    } catch(error) {

        statusBox.textContent =
            "Error: " + error.message +
            ". Check whether backend is running on port 5001.";

    } finally {

        submitBtn.disabled = false;

    }

});

</script>

</body>
</html>
