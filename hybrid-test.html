
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WayMate - Hybrid Recommendation Test</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fa;
            padding: 25px;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #176b61;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input, select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #176b61;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #10534b;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }

        .recommendations {
            margin-top: 25px;
        }

        .destination-card {
            border: 1px solid #ddd;
            border-radius: 9px;
            padding: 18px;
            margin-bottom: 18px;
            background: #fff;
        }

        .destination-card img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 7px;
            margin: 12px 0;
        }

        .destination-card h3 {
            color: #176b61;
            margin-bottom: 10px;
        }

        .destination-card p {
            margin: 7px 0;
            line-height: 1.5;
        }

        .scores {
            background: #f3f6fa;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
        }

        .notes {
            background: #eef7f5;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
        }

        @media(max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>WayMate</h1>
    <p class="subtitle">Hybrid Recommendation System Testing</p>

    <form id="travelForm">

        <div class="form-grid">

            <div class="form-group">
                <label for="startingCity">Starting City</label>
                <input type="text" id="startingCity"
                       placeholder="Enter starting city">
            </div>

            <div class="form-group">
                <label for="days">Number of Days</label>
                <input type="number" id="days"
                       min="1" required placeholder="Enter days">
            </div>

            <div class="form-group">
                <label for="budget">Budget (₹)</label>
                <input type="number" id="budget"
                       min="0" placeholder="Enter budget">
                
                <div class="checkbox-group">
                    <input type="checkbox" id="unlimitedBudget">
                    <label for="unlimitedBudget">Unlimited Budget</label>
                </div>
            </div>

            <div class="form-group">
                <label for="numberOfPeople">Number of Travellers</label>
                <input type="number" id="numberOfPeople"
                       min="1" required placeholder="Enter travellers">
            </div>

            <div class="form-group">
                <label for="travelType">Travel Type</label>
                <select id="travelType" required>
                    <option value="">Select travel type</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Relaxation">Relaxation</option>
                    <option value="Nature">Nature</option>
                    <option value="Historical">Historical</option>
                    <option value="Religious">Religious</option>
                    <option value="Beach">Beach</option>
                    <option value="Any">Any</option>
                </select>
            </div>

            <div class="form-group">
                <label for="companion">Travel Companion</label>
                <select id="companion" required>
                    <option value="">Select companion</option>
                    <option value="Solo">Solo</option>
                    <option value="Friends">Friends</option>
                    <option value="Family">Family</option>
                    <option value="Couple">Couple</option>
                </select>
            </div>

            <div class="form-group">
                <label for="preferredDestination">Preferred Destination</label>
                <input type="text" id="preferredDestination"
                       placeholder="Enter destination or Any">
            </div>

            <div class="form-group">
                <label for="weatherPreference">Weather Preference</label>
                <select id="weatherPreference" required>
                    <option value="Any">Any</option>
                    <option value="Cool">Cool</option>
                    <option value="Warm">Warm</option>
                    <option value="Pleasant">Pleasant</option>
                </select>
            </div>

            <div class="form-group">
                <label for="user_id">User ID (Optional)</label>
                <input type="number" id="user_id"
                       min="1" placeholder="Enter logged-in user ID">
            </div>

        </div>

        <button type="submit" id="submitButton">
            Get Recommendations
        </button>

    </form>

    <div id="status"></div>

    <div id="recommendations" class="recommendations"></div>

</div>

<script>

    // Separate testing API - do not change partner's main frontend
    const API_URL = "http://127.0.0.1:5001/api/plan-trip";

    const form = document.getElementById("travelForm");
    const statusBox = document.getElementById("status");
    const recommendationsBox =
        document.getElementById("recommendations");

    const budgetInput = document.getElementById("budget");
    const unlimitedCheckbox =
        document.getElementById("unlimitedBudget");

    const submitButton =
        document.getElementById("submitButton");


    // Automatically fill user ID if the main frontend
    // exposes it through this global variable.
    if (window.WAYMATE_USER_ID) {
        document.getElementById("user_id").value =
            window.WAYMATE_USER_ID;
    }


    // Unlimited budget handling
    unlimitedCheckbox.addEventListener("change", function () {

        budgetInput.disabled = this.checked;

        if (this.checked) {
            budgetInput.value = "";
        }

    });


    // Safe HTML output
    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function(char) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[char];
        });
    }


    // Display recommendation cards
    function displayRecommendations(data) {

        recommendationsBox.innerHTML = "";

        const recommendations = data.recommendations || [];

        if (!recommendations.length) {
            recommendationsBox.innerHTML =
                "<p>No recommendations found.</p>";
            return;
        }

        recommendations.forEach(function(destination) {

            const imageURL = destination.image_url || destination.image;

            const card = document.createElement("div");
            card.className = "destination-card";

            card.innerHTML = `
                <h3>${escapeHTML(destination.name)}</h3>

                <p><b>Destination ID:</b>
                    ${escapeHTML(destination.destination_id ?? destination.id ?? "N/A")}
                </p>

                ${imageURL ? `
                    <img src="${escapeHTML(imageURL)}"
                         alt="${escapeHTML(destination.name)}"
                         onerror="this.style.display='none'">
                ` : ""}

                <p><b>Destination Type:</b>
                    ${escapeHTML(destination.destination_type ?? destination.type ?? "N/A")}
                </p>

                <p><b>Budget Range:</b>
                    ${escapeHTML(destination.budget_range ?? "N/A")}
                </p>

                <p><b>Recommended Days:</b>
                    ${escapeHTML(destination.recommended_days ?? "N/A")}
                </p>

                <p><b>Rating:</b>
                    ${escapeHTML(destination.rating ?? "Not available")}
                </p>

                <p><b>Match Percentage:</b>
                    ${escapeHTML(destination.match_percentage ?? destination.matchPercentage ?? "N/A")}%
                </p>

                <p><b>Explanation:</b>
                    ${escapeHTML(destination.explanation ?? "Not available")}
                </p>

                <div class="scores">
                    <b>Hybrid Recommendation Scores</b>

                    <p>Content-Based:
                        ${escapeHTML(destination.content_score ?? "N/A")}
                    </p>

                    <p>Collaborative:
                        ${escapeHTML(destination.collaborative_score ?? "N/A")}
                    </p>

                    <p>Knowledge-Based:
                        ${escapeHTML(destination.knowledge_score ?? "N/A")}
                    </p>
                </div>
            `;

            recommendationsBox.appendChild(card);

        });

        if (data.notes) {
            const notes = document.createElement("div");
            notes.className = "notes";
            notes.innerHTML = "<b>Notes:</b> " +
                escapeHTML(
                    Array.isArray(data.notes)
                        ? data.notes.join(" ")
                        : data.notes
                );

            recommendationsBox.appendChild(notes);
        }
    }


    // Form submission
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        statusBox.textContent = "Getting recommendations...";
        recommendationsBox.innerHTML = "";
        submitButton.disabled = true;

        const unlimited = unlimitedCheckbox.checked;

        const budgetValue = budgetInput.value;

        if (!unlimited &&
            (budgetValue === "" || Number(budgetValue) < 0)) {

            statusBox.textContent =
                "Please enter a valid budget or select Unlimited Budget.";

            submitButton.disabled = false;
            return;
        }

        const payload = {

            startingCity:
                document.getElementById("startingCity").value.trim(),

            days:
                Number(document.getElementById("days").value),

            budget: unlimited ? 0 : Number(budgetValue),

            unlimitedBudget: unlimited,

            number_of_people:
                Number(document.getElementById("numberOfPeople").value),

            travelType:
                document.getElementById("travelType").value,

            companion:
                document.getElementById("companion").value,

            preferredDestination:
                document.getElementById("preferredDestination").value.trim() || "Any",

            weatherPreference:
                document.getElementById("weatherPreference").value

        };


        // Send user_id only when available
        const userId = document.getElementById("user_id").value.trim();

        if (userId !== "") {
            payload.user_id = Number(userId);
        }


        try {

            const response = await fetch(API_URL, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(payload)

            });


            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || data.message || "API request failed"
                );
            }

            statusBox.textContent = "Recommendations generated successfully!";

            displayRecommendations(data);

        }

        catch(error) {

            statusBox.textContent =
                "Error: " + error.message;

            console.error("Recommendation API Error:", error);

        }

        finally {

            submitButton.disabled = false;

        }

    });

</script>

</body>
</html>
