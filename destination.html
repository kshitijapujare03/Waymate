    <style>
        /* MAPS AND DESTINATION BUTTONS */

        .destination-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .maps-button {
            background: #0b6670;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .maps-button:hover {
            background: #087f78;
            transform: translateY(-2px);
        }

        /* LIVE WEATHER */

        .live-weather {
            margin-top: 12px;
        }

        .weather-main {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 15px;
        }

        .weather-icon {
            font-size: 42px;
        }

        .weather-temperature {
            font-size: 32px;
            font-weight: 700;
            color: #087f78;
        }

        .weather-condition {
            font-size: 13px;
            color: #718987;
        }

        .weather-extra {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .weather-extra-item {
            background: #f1f8f6;
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
        }

        .weather-extra-item span {
            display: block;
            font-size: 11px;
            color: #718987;
            margin-bottom: 5px;
        }

        .weather-extra-item strong {
            font-size: 13px;
            color: #203b3a;
        }

        .weather-updated {
            display: block;
            font-size: 10px;
            color: #82918f;
            margin-top: 12px;
        }

        .weather-loading {
            color: #718987;
            font-size: 13px;
        }

        @media(max-width:500px) {
            .weather-extra {
                grid-template-columns: 1fr;
            }

            .weather-extra-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: left;
                padding: 10px 14px;
            }

            .weather-extra-item span {
                margin-bottom: 0;
            }
        }
    </style>

        // GOOGLE MAPS FUNCTION

        function openInMaps() {

            if (!selectedDestination) {
                return;
            }

            const details =
                destinationDetails[selectedDestination.name];

            if (!details) {
                alert("Location information is not available.");
                return;
            }

            const destinationCoordinates =
                `${details.latitude},${details.longitude}`;

            const fallbackUrl =
                `https://www.google.com/maps/dir/?api=1&destination=${destinationCoordinates}&travelmode=driving`;

            // Open Maps immediately.
            // This also avoids browser popup blockers.

            const mapWindow = window.open(
                fallbackUrl,
                "_blank"
            );

            if (!mapWindow) {
                window.location.href = fallbackUrl;
                return;
            }

            // Try to get the user's current location.

            if (navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(

                    function(position) {

                        const userLatitude =
                            position.coords.latitude;

                        const userLongitude =
                            position.coords.longitude;

                        const origin =
                            `${userLatitude},${userLongitude}`;

                        const mapsUrl =
                            `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destinationCoordinates}&travelmode=driving`;

                        mapWindow.location.href = mapsUrl;

                    },

                    function(error) {

                        // If location permission is denied,
                        // Maps still opens with the destination.

                        console.log(
                            "Current location unavailable. Opening destination only."
                        );

                    },

                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }

                );

            }

        }

        // FETCH LIVE WEATHER

        async function loadLiveWeather() {

            if (!selectedDestination) {
                return;
            }

            const details =
                destinationDetails[selectedDestination.name];

            const weatherContainer =
                document.getElementById("weatherContent");

            if (!details || !weatherContainer) {
                return;
            }

            weatherContainer.innerHTML = `
                <p class="weather-loading">
                    Loading current weather...
                </p>
            `;

            try {

                const weatherUrl =
                    `https://api.open-meteo.com/v1/forecast?latitude=${details.latitude}&longitude=${details.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&timezone=auto`;

                const response = await fetch(weatherUrl);

                if (!response.ok) {
                    throw new Error("Weather data could not be loaded.");
                }

                const data = await response.json();

                const current = data.current;

                if (!current) {
                    throw new Error("Current weather is unavailable.");
                }

                const condition = getWeatherCondition(
                    current.weather_code,
                    current.is_day
                );

                const temperature =
                    Math.round(current.temperature_2m);

                const feelsLike =
                    Math.round(current.apparent_temperature);

                const humidity =
                    current.relative_humidity_2m;

                const windSpeed =
                    current.wind_speed_10m;

                weatherContainer.innerHTML = `

                    <div class="live-weather">

                        <div class="weather-main">

                            <div class="weather-icon">
                                ${condition.icon}
                            </div>

                            <div>
                                <div class="weather-temperature">
                                    ${temperature}°C
                                </div>

                                <div class="weather-condition">
                                    ${condition.text}
                                </div>
                            </div>

                        </div>

                        <div class="weather-extra">

                            <div class="weather-extra-item">
                                <span>🌡️ Feels Like</span>
                                <strong>${feelsLike}°C</strong>
                            </div>

                            <div class="weather-extra-item">
                                <span>💧 Humidity</span>
                                <strong>${humidity}%</strong>
                            </div>

                            <div class="weather-extra-item">
                                <span>💨 Wind Speed</span>
                                <strong>${windSpeed} km/h</strong>
                            </div>

                        </div>

                        <span class="weather-updated">
                            Live weather · ${current.time.replace("T", " ")}
                            · ${details.location}
                        </span>

                    </div>

                `;

            } catch (error) {

                console.error("Weather error:", error);

                weatherContainer.innerHTML = `
                    <p class="weather-loading">
                        Weather information is currently unavailable.
                        Please check your internet connection and try again.
                    </p>
                `;

            }

        }

                        <h3>🌤️ Live Weather</h3>

                            </p>
                        </div>

                    </div>


                    <div class="detail-box">

                        <h3>⭐ Rating</h3>

                        <p>
                            ${selectedDestination.rating != null
                                ? selectedDestination.rating + " / 5"
                                : "Not available"}
                        </p>

                    </div>


                    ${!isHomeDestination ? `

                    <div class="detail-box">

                        <h3>🎒 Packing Essentials</h3>

                        <ul class="info-list">

                            ${details.packing.map(item => `

                <section class="famous-spots">

                        Famous Spots

                        ${details.spots.map(spot => `

        // SAVE / UNSAVE DESTINATION

        function toggleSave() {

            if (!selectedDestination) {
                return;
            }


            let savedDestinations =
                JSON.parse(
                    localStorage.getItem("savedDestinations")
                ) || [];


            const alreadySaved =
                savedDestinations.some(
                    destination =>
                        destination.name ===
                        selectedDestination.name
                );


            if (alreadySaved) {

                savedDestinations =
                    savedDestinations.filter(
                        destination =>
                            destination.name !==
                            selectedDestination.name
                    );

            } else {

                savedDestinations.push(
                    selectedDestination
                );

            }


            localStorage.setItem(
                "savedDestinations",
                JSON.stringify(savedDestinations)
            );


            updateSaveButton();

        }


        // UPDATE SAVE BUTTON

        function updateSaveButton() {

            const button =
                document.getElementById("saveButton");


            if (!button) {
                return;
            }


            const savedDestinations =
                JSON.parse(
                    localStorage.getItem("savedDestinations")
                ) || [];


            const isSaved =
                savedDestinations.some(
                    destination =>
                        destination.name ===
                        selectedDestination.name
                );


            if (isSaved) {

                button.innerHTML = "✓ Saved";

                button.classList.add("saved");

            } else {

                button.innerHTML = "♡ Save Destination";

                button.classList.remove("saved");

            }

        }


        // DISPLAY DESTINATION

        showDestination();
