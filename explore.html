
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waymate - Explore</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .explore-page {
            background: #f5f8f4;
            min-height: 100vh;
        }

        .explore-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        .explore-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .explore-heading h1 {
            font-size: 34px;
            color: #26352b;
            margin-bottom: 8px;
        }

        .explore-heading p {
            font-size: 16px;
            color: #66736b;
            margin: 0;
        }

        .search-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .search-section input {
            width: 60%;
            max-width: 600px;
            padding: 13px 18px;
            border: 1px solid #d6ddd8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .search-section button {
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .search-section button:hover {
            background: #256628;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6ddd8;
            border-radius: 8px;
            background: white;
            color: #26352b;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .destination-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .explore-destination-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .explore-destination-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .explore-destination-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .destination-card-content {
            padding: 18px;
        }

        .destination-card-content h3 {
            margin: 0 0 6px;
            color: #26352b;
            font-size: 21px;
        }

        .destination-type {
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 9px;
        }

        .destination-description {
            color: #66736b;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
            margin: 0 0 14px;
        }

        .destination-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #26352b;
            border-top: 1px solid #edf0ed;
            padding-top: 12px;
        }

        .destination-days {
            color: #777;
            font-size: 13px;
            margin: 10px 0 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 35px;
        }

        .pagination button {
            width: 38px;
            height: 38px;
            border: 1px solid #d6ddd8;
            border-radius: 7px;
            background: white;
            color: #26352b;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination button:hover {
            background: #eaf3ea;
        }

        .pagination .active-page {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #66736b;
            font-size: 17px;
            display: none;
        }

        @media (max-width: 900px) {
            .destination-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .explore-container {
                width: 92%;
            }

            .search-section {
                flex-direction: column;
            }

            .search-section input {
                width: 100%;
                box-sizing: border-box;
            }

            .search-section button {
                width: 100%;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .destination-grid {
                grid-template-columns: 1fr;
            }

            .explore-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="explore-page">

        <!-- NAVBAR -->
        <nav class="navbar">
    <div class="logo">
        <span>✈</span> Waymate
    </div>

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="explore.html" class="active">Explore</a>
        <a href="trips.html">My Trips</a>
        <a href="account.html">My Account</a>
    </div>
</nav>

        <!-- MAIN CONTENT -->
        <main class="explore-container">

            <div class="explore-heading">
                <h1>Explore Destinations</h1>
                <p>Discover places that match your travel preferences.</p>
            </div>

            <!-- SEARCH -->
            <div class="search-section">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search destinations..."
                >

                <button onclick="searchDestinations()">Search</button>

            </div>

            <!-- FILTERS -->
            <div class="filters">

                <select id="typeFilter" onchange="applyFilters()">
                    <option value="all">All Types</option>
                    <option value="Beach">Beach</option>
                    <option value="Historical & Cultural">Historical & Cultural</option>
                    <option value="Nature">Nature</option>
                    <option value="Hill Station">Hill Station</option>
                    <option value="Historical">Historical</option>
                    <option value="Religious & Historical">Religious & Historical</option>
                    <option value="Adventure & Spiritual">Adventure & Spiritual</option>
                    <option value="Adventure & Nature">Adventure & Nature</option>
                </select>

                <select id="budgetFilter" onchange="applyFilters()">
                    <option value="all">All Budgets</option>
                    <option value="4000">Under ₹4,000</option>
                    <option value="5000">Under ₹5,000</option>
                    <option value="6000">Under ₹6,000</option>
                    <option value="7000">Under ₹7,000</option>
                    <option value="10000">Under ₹10,000</option>
                </select>

                <select id="durationFilter" onchange="applyFilters()">
                    <option value="all">All Durations</option>
                    <option value="2">2 Days</option>
                    <option value="3">3 Days</option>
                    <option value="4">4 Days</option>
                    <option value="5">5 Days</option>
                </select>

                <select id="sortFilter" onchange="applyFilters()">
                    <option value="default">Sort By</option>
                    <option value="priceLow">Price: Low to High</option>
                    <option value="priceHigh">Price: High to Low</option>
                    <option value="ratingHigh">Rating: High to Low</option>
                </select>

            </div>

            <!-- DESTINATION CARDS -->
            <div class="destination-grid" id="destinationGrid"></div>

            <!-- NO RESULTS -->
            <div class="no-results" id="noResults">
                No destinations found.
            </div>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>

        </main>

        <!-- FOOTER -->
        <footer class="footer">
            <p>Your journey, our recommendation.</p>
        </footer>

    </div>

    <script>

        // DESTINATION DATA
        const destinations = [

            {
                name: "Goa",
                type: "Beach",
                description: "Famous beaches, water activities and vibrant nightlife",
                budget: 5000,
                days: 3,
                rating: 4.5,
                image: "https://c.ndtvimg.com/2026-03/pujl6v7o_travel_295x200_23_March_26.jpg"
            },

            {
                name: "Jaipur",
                type: "Historical & Cultural",
                description: "Forts, palaces, markets and rich Rajasthani culture",
                budget: 4500,
                days: 3,
                rating: 4.4,
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRaNzVu524h5yMX5MtXp5Qc3J0HxKUSl3uOvBBJlvhHco-G__TfCmU9jyE&s=10"
            },

            {
                name: "Kerala Backwaters",
                type: "Nature",
                description: "Peaceful backwaters, houseboats and beautiful natural scenery",
                budget: 6000,
                days: 3,
                rating: 4.6,
                image: "https://www.oyorooms.com/travel-guide/wp-content/uploads/2021/06/Kerala-3.jpg"
            },

            {
                name: "Manali",
                type: "Hill Station",
                description: "Mountains, valleys, scenic views and adventure activities",
                budget: 6000,
                days: 4,
                rating: 4.5,
                image: "https://upload.wikimedia.org/wikipedia/commons/0/03/Manali_City.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
            },

            {
                name: "Agra",
                type: "Historical",
                description: "Famous for the Taj Mahal and Mughal architecture",
                budget: 3500,
                days: 2,
                rating: 4.5,
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTwE_M0RB71DnFyWzyer44Ven8HwwgHDjeekOKXsR-6UCtNtBseNwyQVxzs&s=10"
            },

            {
                name: "Hampi",
                type: "Historical",
                description: "Ancient ruins, temples and unique landscapes",
                budget: 4000,
                days: 2,
                rating: 4.6,
                image: "https://d22eux7aqicogj.cloudfront.net/assets/blogs/between-ruin-and-glory-hampi.webp"
            },

            {
                name: "Amritsar",
                type: "Religious & Historical",
                description: "Golden Temple, Jallianwala Bagh and Punjabi culture",
                budget: 4000,
                days: 2,
                rating: 4.7,
                image: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSDXSZp5CXjLnU7rIURcMNxdnqdJUIp8AIU95Hsb4odTlDz4IW-NS3pANE&s=10"
            },

            {
                name: "Rishikesh",
                type: "Adventure & Spiritual",
                description: "River rafting, yoga, temples and mountain views",
                budget: 4500,
                days: 3,
                rating: 4.5,
                image: "https://www.naturetravelagency.com/uploads/1739354839Best%20time%20to%20visit%20Rishikesh.jpg"
            },

            {
                name: "Ladakh",
                type: "Adventure & Nature",
                description: "High-altitude landscapes, monasteries and mountain passes",
                budget: 10000,
                days: 5,
                rating: 4.7,
                image: "https://i0.wp.com/lahimalaya.com/wp-content/uploads/2019/08/Ladakh-trip.jpg?fit=960%2C640&ssl=1"
            },

            {
                name: "Meghalaya",
                type: "Nature",
                description: "Waterfalls, caves, forests and living root bridges",
                budget: 7000,
                days: 4,
                rating: 4.6,
                image: "https://s3.india.com/wp-content/uploads/2025/08/Meghalaya-Thumbnail.jpg"
            }

        ];

        let currentPage = 1;
        const cardsPerPage = 6;
        let filteredDestinations = [...destinations];

        // OPEN DESTINATION FROM EXPLORE
        function openDestination(destination) {

            localStorage.setItem("destinationSource", "explore");

            localStorage.setItem(
                "selectedDestination",
                JSON.stringify(destination)
            );

            window.location.href = "destination.html?source=explore";
        }

        // DISPLAY DESTINATIONS
        function displayDestinations() {

            const grid = document.getElementById("destinationGrid");
            const noResults = document.getElementById("noResults");

            grid.innerHTML = "";

            const start = (currentPage - 1) * cardsPerPage;
            const end = start + cardsPerPage;

            const currentDestinations = filteredDestinations.slice(start, end);

            if (currentDestinations.length === 0) {

                noResults.style.display = "block";
                document.getElementById("pagination").innerHTML = "";
                return;
            }

            noResults.style.display = "none";

            currentDestinations.forEach(destination => {

                const card = document.createElement("div");
                card.className = "explore-destination-card";

                card.innerHTML = `

                    <img
                        src="${destination.image}"
                        alt="${destination.name}"
                        onerror="this.style.display='none';"
                    >

                    <div class="destination-card-content">

                        <h3>${destination.name}</h3>

                        <p class="destination-type">
                            ${destination.type}
                        </p>

                        <p class="destination-description">
                            ${destination.description}
                        </p>

                        <div class="destination-info-row">

                            <span>
                                ₹${destination.budget.toLocaleString("en-IN")}
                            </span>

                            <span>
                                ⭐ ${destination.rating}
                            </span>

                        </div>

                        <p class="destination-days">
                            ${destination.days} days recommended
                        </p>

                    </div>
                `;

                card.addEventListener("click", function() {
                    openDestination(destination);
                });

                grid.appendChild(card);

            });

            displayPagination();
        }

        // DISPLAY PAGINATION
        function displayPagination() {

            const pagination = document.getElementById("pagination");
            pagination.innerHTML = "";

            const totalPages = Math.ceil(
                filteredDestinations.length / cardsPerPage
            );

            if (totalPages <= 1) {
                return;
            }

            for (let i = 1; i <= totalPages; i++) {

                const button = document.createElement("button");
                button.textContent = i;

                if (i === currentPage) {
                    button.classList.add("active-page");
                }

                button.onclick = function(event) {

                    event.stopPropagation();
                    currentPage = i;

                    displayDestinations();

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                };

                pagination.appendChild(button);
            }
        }

        // APPLY FILTERS AND SORTING
        function applyFilters() {

            const searchValue = document.getElementById("searchInput")
                .value.toLowerCase().trim();

            const selectedType = document.getElementById("typeFilter").value;
            const selectedBudget = document.getElementById("budgetFilter").value;
            const selectedDuration = document.getElementById("durationFilter").value;
            const selectedSort = document.getElementById("sortFilter").value;

            filteredDestinations = destinations.filter(destination => {

                const matchesSearch = destination.name
                    .toLowerCase()
                    .includes(searchValue);

                const matchesType =
                    selectedType === "all" ||
                    destination.type === selectedType;

                const matchesBudget =
                    selectedBudget === "all" ||
                    destination.budget <= Number(selectedBudget);

                const matchesDuration =
                    selectedDuration === "all" ||
                    destination.days === Number(selectedDuration);

                return (
                    matchesSearch &&
                    matchesType &&
                    matchesBudget &&
                    matchesDuration
                );
            });

            if (selectedSort === "priceLow") {
                filteredDestinations.sort((a, b) => a.budget - b.budget);
            }

            if (selectedSort === "priceHigh") {
                filteredDestinations.sort((a, b) => b.budget - a.budget);
            }

            if (selectedSort === "ratingHigh") {
                filteredDestinations.sort((a, b) => b.rating - a.rating);
            }

            currentPage = 1;
            displayDestinations();
        }

        // SEARCH DESTINATIONS
        function searchDestinations() {
            applyFilters();
        }

        // SEARCH WHEN ENTER IS PRESSED
        document.getElementById("searchInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {
                    searchDestinations();
                }
            });

        // INITIAL DISPLAY
        displayDestinations();

    </script>

</body>
</html>
