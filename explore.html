<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Waymate - Explore</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .explore-page {
            background: #f5f8f4;
            min-height: 100vh;
        }

        .explore-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 35px 0 60px;
        }

        .explore-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .explore-heading h1 {
            font-size: 34px;
            color: #26352b;
            margin-bottom: 8px;
        }

        .explore-heading p {
            font-size: 16px;
            color: #66736b;
            margin: 0;
        }

        .search-section {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .search-section input {
            width: 60%;
            max-width: 600px;
            padding: 13px 18px;
            border: 1px solid #d6ddd8;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .search-section button {
            padding: 13px 24px;
            border: none;
            border-radius: 8px;
            background: #2e7d32;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .search-section button:hover {
            background: #256628;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .filters select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d6ddd8;
            border-radius: 8px;
            background: white;
            color: #26352b;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .destination-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .explore-destination-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .explore-destination-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .explore-destination-card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .destination-card-content {
            padding: 18px;
        }

        .destination-card-content h3 {
            margin: 0 0 6px;
            color: #26352b;
            font-size: 21px;
        }

        .destination-type {
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
            margin: 0 0 9px;
        }

        .destination-description {
            color: #66736b;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
            margin: 0 0 14px;
        }

        .destination-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #26352b;
            border-top: 1px solid #edf0ed;
            padding-top: 12px;
        }

        .destination-days {
            color: #777;
            font-size: 13px;
            margin: 10px 0 0;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 35px;
        }

        .pagination button {
            width: 38px;
            height: 38px;
            border: 1px solid #d6ddd8;
            border-radius: 7px;
            background: white;
            color: #26352b;
            cursor: pointer;
            font-size: 14px;
        }

        .pagination button:hover {
            background: #eaf3ea;
        }

        .pagination .active-page {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #66736b;
            font-size: 17px;
            display: none;
        }

        @media (max-width: 900px) {
            .destination-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .filters {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .explore-container {
                width: 92%;
            }

            .search-section {
                flex-direction: column;
            }

            .search-section input {
                width: 100%;
                box-sizing: border-box;
            }

            .search-section button {
                width: 100%;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .destination-grid {
                grid-template-columns: 1fr;
            }

            .explore-heading h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="explore-page">

        <!-- NAVBAR -->
        <nav class="navbar">

            <div class="logo">
                <span>Way</span>mate
            </div>

            <div class="nav-links">
                <a href="home.html">Home</a>
                <a href="explore.html" class="active">Explore</a>
                <a href="plan.html">Plan My Trip</a>
                <a href="trips.html">My Trips</a>
                <a href="account.html">My Account</a>
            </div>

        </nav>


        <!-- MAIN CONTENT -->
        <main class="explore-container">

            <div class="explore-heading">

                <button id="backToExplore" style="display: none;">
    ← Back
</button>

                <h1>Explore Destinations</h1>

                <p>
                    Discover places that match your travel preferences.
                </p>

            </div>


            <!-- SEARCH -->
            <div class="search-section">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search destinations..."
                >

                <button onclick="searchDestinations()">
                    Search
                </button>

            </div>


            <!-- FILTERS -->
            <div class="filters">

               <select id="typeFilter" onchange="applyFilters()">

    <option value="all">
        All Types
    </option>

    <option value="Beach">
        Beach
    </option>

    <option value="Mountain">
        Mountain
    </option>

    <option value="Heritage">
        Heritage
    </option>

    <option value="Nature">
        Nature
    </option>

    <option value="Religious">
        Religious
    </option>

    <option value="Adventure">
        Adventure
    </option>

</select>

                <select id="budgetFilter" onchange="applyFilters()">

                    <option value="all">
                        All Budgets
                    </option>

                    <option value="4000">
                        Under ₹4,000
                    </option>

                    <option value="5000">
                        Under ₹5,000
                    </option>

                    <option value="6000">
                        Under ₹6,000
                    </option>

                    <option value="7000">
                        Under ₹7,000
                    </option>

                    <option value="10000">
                        Under ₹10,000
                    </option>

                </select>


                <select id="durationFilter" onchange="applyFilters()">

                    <option value="all">
                        All Durations
                    </option>

                    <option value="2">
                        2 Days
                    </option>

                    <option value="3">
                        3 Days
                    </option>

                    <option value="4">
                        4 Days
                    </option>

                    <option value="5">
                        5 Days
                    </option>

                </select>


                <select id="sortFilter" onchange="applyFilters()">

                    <option value="default">
                        Sort By
                    </option>

                    <option value="priceLow">
                        Price: Low to High
                    </option>

                    <option value="priceHigh">
                        Price: High to Low
                    </option>

                    <option value="ratingHigh">
                        Rating: High to Low
                    </option>

                </select>

            </div>


            <!-- DESTINATION CARDS -->
            <div
                class="destination-grid"
                id="destinationGrid">
            </div>


            <div
                class="no-results"
                id="noResults">
                No destinations found.
            </div>


            <!-- PAGINATION -->
            <div
                class="pagination"
                id="pagination">
            </div>

        </main>


        <!-- FOOTER -->
        <footer class="footer">

            <p>
                Your journey, our recommendation.
            </p>

        </footer>

    </div>
<script src="explore.js"></script>
        
Waymate/explore.html
</body>

</html>
